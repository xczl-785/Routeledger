name: Codex plugin

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".agents/plugins/marketplace.json"
      - "plugins/routeledger/**"
      - ".gitattributes"
      - ".github/workflows/codex-plugin.yml"
  push:
    branches:
      - "**"
    tags:
      - "routeledger-plugin-v*"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".agents/plugins/marketplace.json"
      - "plugins/routeledger/**"
      - ".gitattributes"
      - ".github/workflows/codex-plugin.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: .
    shell: bash

jobs:
  plugin-contract:
    name: plugin contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Codex CLI
        run: npm install --global @openai/codex@0.144.1
      - name: Resolve the pinned Codex CLI entrypoint
        working-directory: .
        run: |
          npm_global_root="$(npm root --global)"
          codex_cli_js="${npm_global_root}/@openai/codex/bin/codex.js"
          node -e 'require("node:fs").accessSync(process.argv[1])' "$codex_cli_js"
          printf 'CODEX_CLI_JS=%s\n' "$codex_cli_js" >> "$GITHUB_ENV"
      - name: Resolve previous plugin ref
        id: previous
        working-directory: .
        run: |
          zero_ref='0000000000000000000000000000000000000000'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "$zero_ref" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build bundled plugin artifact
        run: pnpm build:codex-plugin
      - name: Smoke bundled plugin
        run: pnpm smoke:codex-plugin
      - name: Check release metadata and version replay guard
        env:
          PREVIOUS_REF: ${{ steps.previous.outputs.ref }}
          IS_PLUGIN_TAG: ${{ startsWith(github.ref, 'refs/tags/routeledger-plugin-v') }}
          IS_RELEASE_BRANCH: ${{ github.ref == 'refs/heads/codex-marketplace' }}
        run: |
          args=()
          if [ -n "$PREVIOUS_REF" ]; then args+=(--previous-ref "$PREVIOUS_REF"); fi
          if [ "$IS_PLUGIN_TAG" = "true" ] || [ "$IS_RELEASE_BRANCH" = "true" ]; then args+=(--require-tag-ref); fi
          pnpm run check:codex-plugin-release "${args[@]}"
      - name: Smoke Codex Git marketplace ingestion
        run: pnpm smoke:codex-git-marketplace
      - name: Assert generated plugin artifact is committed
        working-directory: .
        run: |
          git diff --exit-code -- plugins/routeledger
          test -z "$(git ls-files --others --exclude-standard -- plugins/routeledger)"

  quality:
    name: workspace quality (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run workspace quality checks
        run: pnpm test && pnpm typecheck && pnpm lint
