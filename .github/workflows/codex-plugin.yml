name: Codex plugin

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "routeledger-plugin-v*"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".agents/plugins/marketplace.json"
      - "plugins/routeledger/**"
      - ".gitattributes"
      - ".github/workflows/codex-plugin.yml"
      - "docs/release/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: .
    shell: bash

jobs:
  plugin-contract:
    name: plugin contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Codex CLI
        run: npm install --global @openai/codex@0.144.1
      - name: Resolve the pinned Codex CLI entrypoint
        working-directory: .
        run: |
          npm_global_root="$(npm root --global)"
          codex_cli_js="${npm_global_root}/@openai/codex/bin/codex.js"
          node -e 'require("node:fs").accessSync(process.argv[1])' "$codex_cli_js"
          printf 'CODEX_CLI_JS=%s\n' "$codex_cli_js" >> "$GITHUB_ENV"
      - name: Resolve previous plugin ref
        id: previous
        working-directory: .
        run: |
          zero_ref='0000000000000000000000000000000000000000'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event.before }}" != "$zero_ref" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build bundled plugin artifact
        run: pnpm build:codex-plugin
      - name: Smoke bundled plugin
        run: pnpm smoke:codex-plugin
      - name: Check release metadata and version replay guard
        env:
          PREVIOUS_REF: ${{ steps.previous.outputs.ref }}
          IS_PLUGIN_TAG: ${{ startsWith(github.ref, 'refs/tags/routeledger-plugin-v') }}
        run: |
          args=()
          if [ -n "$PREVIOUS_REF" ]; then args+=(--previous-ref "$PREVIOUS_REF"); fi
          if [ "$IS_PLUGIN_TAG" = "true" ]; then args+=(--require-tag-ref); fi
          pnpm run check:codex-plugin-release "${args[@]}"
      - name: Create immutable release attestation
        if: startsWith(github.ref, 'refs/tags/routeledger-plugin-v') && matrix.os == 'ubuntu-latest'
        run: pnpm attest:codex-plugin --tag "${{ github.ref_name }}" --output "${{ runner.temp }}/${{ github.ref_name }}-attestation.json"
      - name: Upload immutable release attestation
        if: startsWith(github.ref, 'refs/tags/routeledger-plugin-v') && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-attestation
          path: ${{ runner.temp }}/${{ github.ref_name }}-attestation.json
          if-no-files-found: error
      - name: Smoke Codex Git marketplace ingestion
        run: pnpm smoke:codex-git-marketplace
      - name: Assert generated plugin artifact is committed
        working-directory: .
        run: |
          git diff --exit-code -- plugins/routeledger
          test -z "$(git ls-files --others --exclude-standard -- plugins/routeledger)"

  quality:
    name: workspace quality (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run workspace quality checks
        run: pnpm test && pnpm typecheck && pnpm lint
      # Note: the UI Mission Control GUI launch (browser spawn) is not a CI
      # gate. Headless launcher logic (arg parsing, registry IO, view-model
      # build) is covered by the launcher and mission-control vitest suites,
      # which pnpm test above already exercises.

  publish-attestation:
    name: publish immutable attestation
    if: startsWith(github.ref, 'refs/tags/routeledger-plugin-v')
    needs: [plugin-contract, quality]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified attestation
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.ref_name }}-attestation
          path: ${{ runner.temp }}/routeledger-attestation
      - name: Publish durable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_NAME: ${{ github.ref_name }}-attestation.json
          ATTESTATION_PATH: ${{ runner.temp }}/routeledger-attestation/${{ github.ref_name }}-attestation.json
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "RouteLedger Codex plugin ${RELEASE_TAG#routeledger-plugin-v}" --generate-notes
          fi
          published_path="${RUNNER_TEMP}/published-${ASSET_NAME}"
          if gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --output "$published_path" >/dev/null 2>&1; then
            cmp -s "$ATTESTATION_PATH" "$published_path" || {
              echo "Published attestation differs from the verified tag proof; refusing to overwrite it." >&2
              exit 1
            }
          else
            gh release upload "$RELEASE_TAG" "$ATTESTATION_PATH"
          fi
